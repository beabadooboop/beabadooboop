html = r'''<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>My Start Page</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif}
body{min-height:100svh;padding:max(14px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
.banner{width:100%;aspect-ratio:16/7;min-height:130px;max-height:250px;border-radius:16px;overflow:hidden;position:relative;background:linear-gradient(135deg,#303030,#101010);border:1px solid #292929;flex:none}
.banner img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover}
.banner:after{content:"START";position:absolute;left:18px;bottom:14px;font-size:clamp(1.2rem,5vw,2rem);font-weight:800;letter-spacing:.22em;text-shadow:0 2px 12px #000}
.spacer{flex:1;min-height:24px}
.bookmarks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 10px;margin-top:auto}
.bookmark{min-width:0;display:flex;flex-direction:column;align-items:center;gap:7px;color:#fff;text-decoration:none}
.icon{width:min(17vw,66px);height:min(17vw,66px);min-width:48px;min-height:48px;border-radius:16px;display:grid;place-items:center;background:#171717;border:1px solid #292929;font-size:24px;font-weight:700}
.label{width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;font-size:11px;color:#b8b8b8}
@media(min-width:600px){body{max-width:520px;margin:auto}.icon{width:62px;height:62px}}
</style>
</head>
<body>
<!-- Put an image named banner.jpg beside this file, or change the filename below. -->
<header class="banner"><img src="banner.jpg" alt="" onerror="this.style.display='none'"></header>
<div class="spacer"></div>
<nav class="bookmarks" aria-label="Website bookmarks">
<a class="bookmark" href="https://www.google.com"><span class="icon">G</span><span class="label">Google</span></a>
<a class="bookmark" href="https://www.youtube.com"><span class="icon">▶</span><span class="label">YouTube</span></a>
<a class="bookmark" href="https://www.reddit.com"><span class="icon">r</span><span class="label">Reddit</span></a>
<a class="bookmark" href="https://www.wikipedia.org"><span class="icon">W</span><span class="label">Wikipedia</span></a>
<a class="bookmark" href="https://mail.google.com"><span class="icon">✉</span><span class="label">Gmail</span></a>
<a class="bookmark" href="https://www.instagram.com"><span class="icon">◎</span><span class="label">Instagram</span></a>
<a class="bookmark" href="https://www.bbc.co.uk/news"><span class="icon">BBC</span><span class="label">BBC News</span></a>
<a class="bookmark" href="https://www.amazon.co.uk"><span class="icon">a</span><span class="label">Amazon</span></a>
</nav>
</body>
</html>
