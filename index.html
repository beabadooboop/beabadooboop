
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>beabadooboop</title>

  <style>
    :root {
      --background: #000000;
      --tile: #171717;
      --tile-border: #292929;
      --text: #ffffff;
      --muted: #aaaaaa;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;

      padding:
        max(14px, env(safe-area-inset-top))
        16px
        max(60px, calc(env(safe-area-inset-bottom) + 14px));

      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Square banner image */
.banner {
  width: 90%;
  aspect-ratio: 3 / 4;
  position: relative;
  left: calc(50% - 4px);
  transform: translateX(-50%);
  margin-left: 0;
  border-radius: 16px;
  overflow: hidden;
  background: #111111;
  border: 1px solid #292929;
  flex: 0 0 auto;
}

    .banner img {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* Banner title */
    .banner::after {
      content: "";
      position: absolute;
      left: 18px;
      bottom: 16px;
      color: #ffffff;
      font-size: clamp(1.4rem, 6vw, 2rem);
      font-weight: 800;
      letter-spacing: 0.22em;
      text-shadow: 0 2px 12px #000000;
      pointer-events: none;
    }

    /* Flexible space between banner and bookmarks */
    .spacer {
      flex: 1 0 10px;
    }

    /* One row of five bookmarks */
    .bookmarks {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px 8px;
      width: 100%;
      margin-top: auto;
    }

    .bookmark {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      color: var(--text);
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Bookmark icons */
    .bookmark-icon {
      width: min(14vw, 40px);
      height: min(14vw, 40px);
      min-width: 0;
      min-height: 0;

      display: grid;
      place-items: center;

      border-radius: 14px;
      background: var(--tile);
      border: 1px solid var(--tile-border);

      font-size: 23px;
      font-weight: 700;
      overflow: hidden;

      transition: transform 0.12s ease;
    }

    .bookmark:active .bookmark-icon {
      transform: scale(0.94);
    }

    /* Optional custom bookmark images */
    .bookmark-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Bookmark labels */
    .bookmark-label {
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
      font-size: 10px;
      color: var(--muted);
    }

    /* Wider screens */
    @media (min-width: 600px) {
      body {
        max-width: 520px;
        margin: 0 auto;
      }

      .bookmark-icon {
        width: 58px;
        height: 58px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <!-- Upload banner.jpg to the same GitHub repository -->
  <header class="banner">
    <img
      src="banner.png"
      alt="Banner"
      onerror="this.style.display='none'"
    >
  </header>

  <div class="spacer" aria-hidden="true"></div>

  <!-- Five bookmarks -->
  <nav class="bookmarks" aria-label="Website bookmarks">


        <!-- Wordle -->
    <a
      class="bookmark"
      href="https://www.nytimes.com/games/wordle/index.html"
    >
      <span
        class="bookmark-icon"
        style="background:#6aaa64;">
         <span style="font-size:22px;">w</span>
      </span>
      <span class="bookmark-label">Wordle</span>
    </a>


        <!-- News -->
    <a class="bookmark" href="https://www.bbc.co.uk/news">
        <span class="bookmark-icon"
      style="background:#cd5555;">
  <span style="font-size:15px;">bbc</span>
</span>
      <span class="bookmark-label">News</span>
    </a>
    
          <!-- INSTA -->
    <a class="bookmark" href="https://www.instagram.com/">
      <span class="bookmark-icon"
        style="background:#d9468f;">
       <span style="font-size:16px;">IG</span>
      </span>
      <span class="bookmark-label">Insta</span>
    </a>

        <!-- Motorsport -->
    <a class="bookmark" href="https://raceday.watch/#sessions">
      <span class="bookmark-icon"
        style="background:#ab1b1b;">
       <span style="font-size:16px;">🏁</span>
      </span>
      <span class="bookmark-label">Racing</span>
    </a>

    





  </nav>

</body>
</html>
